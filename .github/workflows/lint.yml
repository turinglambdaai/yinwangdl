name: Lint Posts

on:
  push:
    paths:
      - 'posts/**'
      - 'scripts/lint_posts.py'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - 'posts/**'
      - 'scripts/lint_posts.py'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint posts
        run: python scripts/lint_posts.py
